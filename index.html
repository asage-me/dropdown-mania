<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dropdown Archive</title>
    <meta name="description" content="A catalogue of dropdown menus: their taxonomy, the games built from them, and the aesthetic they inherited from 1999.">
    <meta name="color-scheme" content="light dark">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=Space+Mono:wght@400;700&display=swap">

    <!-- Every stylesheet loads once; wings scope their rules under body[data-mode]. -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/select.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/education.css">
    <link rel="stylesheet" href="css/games.css">
    <link rel="stylesheet" href="css/retro-1999.css">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314171a'/%3E%3Cpath d='M7 11h18M7 17h18M7 23h11' stroke='%23c0392b' stroke-width='2.5'/%3E%3C/svg%3E">
</head>
<body data-mode="home">
    <a class="u-skip" href="#main-content">Skip to the archive</a>

    <header class="site-header">
        <nav class="nav" id="site-nav" aria-label="Archive">
            <a class="nav__brand" href="#/">
                The Dropdown <span>Archive</span>
            </a>

            <ul class="nav__wings">
                <li><a class="nav__link" data-nav-link="education" href="#/education">I · Education</a></li>
                <li><a class="nav__link" data-nav-link="games" href="#/games">II · Games</a></li>
                <li><a class="nav__link" data-nav-link="retro" href="#/retro">III · Retro 1999</a></li>
            </ul>

            <div class="nav__tools">
                <button type="button" class="nav__palette" data-open-palette>
                    Search<span class="kbd-hint">Ctrl K</span>
                </button>

                <div class="nav__mode">
                    <label class="nav__mode-label" for="mode-select">Wing</label>
                    <select id="mode-select">
                        <option value="home">Reading room</option>
                        <option value="education">I · Education</option>
                        <option value="games">II · Games</option>
                        <option value="retro">III · Retro 1999</option>
                    </select>
                </div>

                <button type="button" class="nav__theme" id="theme-toggle" aria-pressed="false">
                    <span class="nav__theme-mark" aria-hidden="true">◐</span>
                    <span data-theme-label>Daylight</span>
                    <span class="u-visually-hidden">Toggle the reading-room theme</span>
                </button>
            </div>
        </nav>
    </header>

    <main id="main-content" class="wing" tabindex="-1">
        <!-- The router mounts the active wing here. -->
        <noscript>
            <div class="load-error">
                <h2>The archive needs JavaScript</h2>
                <p>Each wing is a working exhibit — dropdowns that open, filter, remember and
                    validate — so this site cannot run without scripting enabled.</p>
            </div>
        </noscript>
    </main>

    <footer class="site-footer">
        <div class="site-footer__inner">
            <span>The Dropdown Archive · MMXXVI</span>
            <span>17 exhibits · 3 wings · 1 interaction</span>
            <span><a href="#/" data-open-records>Record book</a> · <a href="#/" data-open-palette>Index</a></span>
        </div>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
